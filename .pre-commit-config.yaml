# 提交前钩子。安装：bash scripts/install.sh
#
# 这里只放**快**的检查（秒级）。慢的、需要完整环境的检查放在 scripts/check.sh 和 CI 里。
# 钩子的作用是让明显问题在提交那一刻就被拦下，而不是等到 CI。

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^frontend/src/shared/api/generated/
      - id: end-of-file-fixer
        exclude: ^frontend/src/shared/api/generated/
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      # 生成物必须由 scripts/api-generate.sh 产生。这里按当前契约重新生成一份并逐字比对：
      # 手工编辑、或改了契约却没重新生成都会被拦下，正常重新生成的结果则放行。
      # 改契约时 openapi/goalflow.yaml 也会触发本钩子，确保两者一起提交。
      - id: generated-types-match-contract
        name: 生成物与契约一致
        entry: bash scripts/check-generated-types.sh
        language: system
        files: ^(frontend/src/shared/api/generated/|openapi/goalflow\.yaml$)
        pass_filenames: false

# 关于迁移：
# "已合并的迁移不可修改" 这条规则需要对比 base 分支才能区分"修改已有迁移"和"新增迁移"，
# 本地钩子做不到，因此由 CI 的 pr-hygiene 作业负责。见 .github/workflows/ci.yml。
