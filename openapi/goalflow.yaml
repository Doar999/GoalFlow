        focus_status:
          $ref: '#/components/schemas/GoalFocusStatus'
          description: focus 只提升弹性任务排序权重
        goal_id:
          description: 活动目标 ID
          maxLength: 36
          title: Goal Id
          type: string
        rank:
          description: 目标顺序，数值小者优先；只参与弹性任务取舍
          minimum: 1.0
          title: Rank
          type: integer
      required:
      - goal_id
      - focus_status
      - rank
      title: PreferenceInput
      type: object
    ProfileDraftReadiness:
      description: 档案草稿的就绪状态（03 第 2 节）。
      enum:
      - needs_input
      - review_ready
      - blocked
      title: ProfileDraftReadiness
      type: string
    ProfileDraftResponse:
      description: 档案草稿。事实、推断、假设和未知可区分（R02）。
      properties:
        assumptions:
          description: 已采用但未经用户确认的假设
          items:
            additionalProperties: true
            type: object
          title: Assumptions
          type: array
        content:
          additionalProperties: true
          description: 草稿正文，结构由澄清引擎版本决定
          title: Content
          type: object
        contradictions:
          description: 检测到的陈述矛盾
          items:
            additionalProperties: true
            type: object
          title: Contradictions
          type: array
        gaps:
          description: 尚缺的关键事实
          items:
            additionalProperties: true
            type: object
          title: Gaps
          type: array
        goal_id:
          title: Goal Id
          type: string
        readiness:
          $ref: '#/components/schemas/ProfileDraftReadiness'
        revision:
          description: 服务端当前版本号
          minimum: 0.0
          title: Revision
          type: integer
        source_map:
          additionalProperties: true
          description: 各字段来源：用户陈述、推断或建议
          title: Source Map
          type: object
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - revision
      - goal_id
      - content
      - source_map
      - gaps
      - assumptions
      - contradictions
      - readiness
      - updated_at
      title: ProfileDraftResponse
      type: object
    ProfileResponse:
      description: 不可变的已确认档案版本。
      properties:
        baseline:
          additionalProperties: true
          title: Baseline
          type: object
        confirmed_at:
          format: date-time
          title: Confirmed At
          type: string
        constraints:
          additionalProperties: true
          title: Constraints
          type: object
        facts:
          additionalProperties: true
          description: 用户事实、假设、建议分别带来源与确认状态
          title: Facts
          type: object
        goal_id:
          title: Goal Id
          type: string
        id:
          title: Id
          type: string
        result_definition:
          title: Result Definition
          type: string
        success_criteria:
          description: 成功标准逐条列表，含标识与验证方式
          items:
            additionalProperties: true
            type: object
          title: Success Criteria
          type: array
        version_no:
          minimum: 1.0
          title: Version No
          type: integer
      required:
      - id
      - goal_id
      - version_no
      - result_definition
      - success_criteria
      - baseline
      - constraints
      - facts
      - confirmed_at
      title: ProfileResponse
      type: object
    ProposeGoalLinkRequest:
      description: 提出关联。必须携带具体任务关系（18 号第 2 节）。
      properties:
        dependencies:
          description: 具体的任务先后依赖边；至少一条。此时仅创建 proposed 关联，确认后才建立依赖边
          items:
            $ref: '#/components/schemas/TaskDependencyEdge'
          minItems: 1
          title: Dependencies
          type: array
        target_goal_id:
          description: 关联对方目标；连同路径 goal_id 规范化为目标对
          maxLength: 36
          title: Target Goal Id
          type: string
      required:
      - target_goal_id
      - dependencies
      title: ProposeGoalLinkRequest
      type: object
    ProposeUnlinkRequest:
      description: 生成解除提案及影响分析（18 号第 3 节）。操作本身不被未完成依赖阻止。
      properties: {}
      title: ProposeUnlinkRequest
      type: object
    RegisterRequest:
      properties:
        account_identifier:
          description: 账号标识，可以是用户名或邮箱格式（首版不验证邮箱）。规范化后需为 3–254 个字符，不含空白
          maxLength: 1024
          title: Account Identifier
          type: string
        password:
          description: 12–128 个字符，不得与账号标识相同
          format: password
          maxLength: 1024
          title: Password
          type: string
          writeOnly: true
        timezone:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          description: IANA 时区名，例如 Asia/Shanghai。省略时为 UTC
          title: Timezone
      required:
      - account_identifier
      - password
      title: RegisterRequest
      type: object
    RegistrationStatusResponse:
      properties:
        registration_open:
          description: 本实例是否接受新用户注册。关闭后已有用户仍可登录
          title: Registration Open
          type: boolean
      required:
      - registration_open
      title: RegistrationStatusResponse
      type: object
    ResetPasswordRequest:
      properties:
        new_password:
          description: 12–128 个字符，不得与账号标识相同
          format: password
          maxLength: 1024
          title: New Password
          type: string
          writeOnly: true
        token:
          description: 部署者用本地命令签发的一次性重置令牌
          format: password
          maxLength: 1024
          title: Token
          type: string
          writeOnly: true
      required:
      - token
      - new_password
      title: ResetPasswordRequest
      type: object
    ResumeGoalRequest:
      properties:
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
      required:
      - expected_revision
      title: ResumeGoalRequest
      type: object
    ReviewPeriod:
      description: 维持型目标的周期回顾节奏（12-goal-lifecycle.md 第 4 节，默认 weekly）。
      enum:
      - weekly
      - biweekly
      - monthly
      title: ReviewPeriod
      type: string
    RouteResponse:
      description: 结构化路线（11 号第 4 节）。
      properties:
        approach:
          title: Approach
          type: string
        assumptions:
          items:
            additionalProperties: true
            type: object
          title: Assumptions
          type: array
        based_on_route_id:
          anyOf:
          - type: string
          - type: 'null'
          description: 非空表示由该路线微调产生的变体
          title: Based On Route Id
        created_at:
          format: date-time
          title: Created At
          type: string
        derived_metrics:
          $ref: '#/components/schemas/DerivedMetric'
        difference_keys:
          description: 与其他候选的差异维度，取自受控枚举（11 号第 5 节）
          items:
            type: string
          title: Difference Keys
          type: array
        duration_range:
          additionalProperties: true
          title: Duration Range
          type: object
        id:
          title: Id
          type: string
        phase_outline:
          description: 每阶段成果、预计周数及每周分钟数
          items:
            additionalProperties: true
            type: object
          title: Phase Outline
          type: array
        required_resources:
          items:
            additionalProperties: true
            type: object
          title: Required Resources
          type: array
        revision:
          description: 服务端当前版本号
          minimum: 0.0
          title: Revision
          type: integer
        risks:
          items:
            additionalProperties: true
            type: object
          title: Risks
          type: array
        route_set_id:
          title: Route Set Id
          type: string
        status:
          $ref: '#/components/schemas/RouteStatus'
        title:
          title: Title
          type: string
        tradeoffs:
          items:
            additionalProperties: true
            type: object
          title: Tradeoffs
          type: array
        weekly_minutes:
          minimum: 0.0
          title: Weekly Minutes
          type: integer
      required:
      - revision
      - id
      - route_set_id
      - status
      - based_on_route_id
      - title
      - approach
      - difference_keys
      - duration_range
      - phase_outline
      - weekly_minutes
      - tradeoffs
      - risks
      - assumptions
      - required_resources
      - derived_metrics
      - created_at
      title: RouteResponse
      type: object
    RouteSelectionResponse:
      description: 路线选择结果。选择动作不创建正式任务（11 号第 7 节）。
      properties:
        goal_id:
          title: Goal Id
          type: string
        revision:
          description: 服务端当前版本号
          minimum: 0.0
          title: Revision
          type: integer
        route_id:
          title: Route Id
          type: string
        selected_at:
          format: date-time
          title: Selected At
          type: string
      required:
      - revision
      - goal_id
      - route_id
      - selected_at
      title: RouteSelectionResponse
      type: object
    RouteSetResponse:
      description: 当前可比较的整组路线与派生冲突（11 号第 8 节）。
      properties:
        availability_revision:
          description: 生成时所处的可用时间版本
          title: Availability Revision
          type: integer
        created_at:
          format: date-time
          title: Created At
          type: string
        goal_id:
          title: Goal Id
          type: string
        id:
          title: Id
          type: string
        invalidated_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Invalidated Reason
        planning_revision:
          description: 生成时所处的 planning revision；与当前值不一致即为 stale
          title: Planning Revision
          type: integer
        profile_id:
          title: Profile Id
          type: string
        revision:
          description: 服务端当前版本号
          minimum: 0.0
          title: Revision
          type: integer
        routes:
          items:
            $ref: '#/components/schemas/RouteResponse'
          title: Routes
          type: array
        status:
          $ref: '#/components/schemas/RouteSetStatus'
      required:
      - revision
      - id
      - goal_id
      - profile_id
      - status
      - invalidated_reason
      - planning_revision
      - availability_revision
      - routes
      - created_at
      title: RouteSetResponse
      type: object
    RouteSetStatus:
      description: 路线集合状态。新集合不覆盖旧集合；输入 revision 变化使晚返回结果 stale（11 号第 3、6 节）。
      enum:
      - current
      - superseded
      - stale
      - failed
      title: RouteSetStatus
      type: string
    RouteStatus:
      description: 单条路线状态。微调创建 based_on_route_id 指向原路线的新变体（11 号第 6 节）。
      enum:
      - current
      - superseded
      title: RouteStatus
      type: string
    RouteVariantRequest:
      properties:
        adjustment:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: 结构化微调；与 natural_language 二选一
          title: Adjustment
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
        natural_language:
          anyOf:
          - maxLength: 4000
            type: string
          - type: 'null'
          description: 自然语言微调要求
          title: Natural Language
        route_id:
          maxLength: 36
          title: Route Id
          type: string
      required:
      - expected_revision
      - route_id
      title: RouteVariantRequest
      type: object
    SchedulingPreferencesResponse:
      description: 偏好保存结果：新的排期协调入口版本（05-module-contracts update_goal_priorities）。
      properties:
        planning_revision:
          description: 更新后的 planning revision；变化触发受影响安排重算
          minimum: 0.0
          title: Planning Revision
          type: integer
        preferences:
          description: 保存后的全部活动目标偏好
          items:
            $ref: '#/components/schemas/PreferenceInput'
          title: Preferences
          type: array
      required:
      - planning_revision
      - preferences
      title: SchedulingPreferencesResponse
      type: object
    SchedulingReasonCode:
      description: '排期原因码（13-scheduling-engine.md 第 6 节）。


        同时用于 agenda_items 的安排原因、deferred_tasks 的延期原因和 conflicts 的冲突类型；

        具体语义随所在集合不同，字段描述里分别说明。'
      enum:
      - MANDATORY_CAPACITY_CONFLICT
      - WEEKLY_CAPACITY_CONFLICT
      - DEADLINE_RISK
      - DEPENDENCY_BLOCKED
      - MINIMUM_SESSION_UNFIT
      - CROSS_GOAL_IMPACT
      title: SchedulingReasonCode
      type: string
    SelectRouteRequest:
      properties:
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
        route_id:
          maxLength: 36
          title: Route Id
          type: string
      required:
      - expected_revision
      - route_id
      title: SelectRouteRequest
      type: object
    SessionInfo:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        expires_at:
          description: 绝对过期时间。7 天无活动会更早失效
          format: date-time
          title: Expires At
          type: string
      required:
      - created_at
      - expires_at
      title: SessionInfo
      type: object
    TaskConstraintResponse:
      description: 单日任务约束的保存结果（05-module-contracts constrain_today_task）。
      properties:
        constraint_kind:
          $ref: '#/components/schemas/TaskDayConstraintKind'
        local_date:
          format: date
          title: Local Date
          type: string
        revision:
          description: 服务端当前版本号
          minimum: 0.0
          title: Revision
          type: integer
        status:
          description: active / cleared；清除保留历史行（Q08）
          title: Status
          type: string
        task_id:
          title: Task Id
          type: string
      required:
      - revision
      - task_id
      - local_date
      - constraint_kind
      - status
      title: TaskConstraintResponse
      type: object
    TaskDayConstraintKind:
      description: '单日任务约束（03 第 4 节 task_day_constraints.constraint_kind）。


        must_do_today 固定日期；locked 还固定当前分配分钟数（13 号第 4 节）。'
      enum:
      - must_do_today
      - locked
      title: TaskDayConstraintKind
      type: string
    TaskDependencyEdge:
      description: 关联携带的一条具体任务依赖（18 号第 2 节：不接受只有两个 goal_id 的"相关"声明）。
      properties:
        predecessor_task_id:
          description: 前驱任务（须先完成/通过的一方）
          maxLength: 36
          title: Predecessor Task Id
          type: string
        required_outcome:
          $ref: '#/components/schemas/DependencyOutcome'
          description: 满足条件：执行完成或验证通过
        successor_task_id:
          description: 后继任务
          maxLength: 36
          title: Successor Task Id
          type: string
      required:
      - predecessor_task_id
      - successor_task_id
      - required_outcome
      title: TaskDependencyEdge
      type: object
    TaskExecutionStatus:
      description: '任务执行状态（03 第 3 节）。


        blocked 是排期计算得到的展示态，不落库；paused 目标下的任务不改写执行状态（D12）。'
      enum:
      - proposed
      - pending
      - in_progress
      - completed
      - cancelled
      title: TaskExecutionStatus
      type: string
    TaskExecutor:
      description: 任务的执行者类型（12 号第 4 节：用户任务、Agent 任务和协作任务分别计算用户投入）。
      enum:
      - user
      - agent
      - collaborative
      title: TaskExecutor
      type: string
    UndoClosureRequest:
      properties:
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
      required:
      - expected_revision
      title: UndoClosureRequest
      type: object
    UnlinkImpact:
      description: 解除提案的影响分析（18 号第 3 节）。结构随业务实现细化，首版用说明性键。
      properties:
        affected_milestones:
          description: 受影响的里程碑与期限
          items:
            additionalProperties: true
            type: object
          title: Affected Milestones
          type: array
        criteria_unsatisfiable:
          description: 完成标准引用了前驱产出、解除后将不可执行的后继任务
          items:
            additionalProperties: true
            type: object
          title: Criteria Unsatisfiable
          type: array
        satisfied_edges:
          description: 已满足的依赖边；随关联归档，无需处理
          items:
            additionalProperties: true
            type: object
          title: Satisfied Edges
          type: array
        unsatisfied_edges:
          description: 该关联下未满足的依赖边清单，每条含后继任务及其当前执行状态
          items:
            additionalProperties: true
            type: object
          title: Unsatisfied Edges
          type: array
      required:
      - unsatisfied_edges
      - criteria_unsatisfiable
      - affected_milestones
      - satisfied_edges
      title: UnlinkImpact
      type: object
    UpdateAvailabilityRequest:
      description: 提交周额度与生效日期（05-module-contracts update_availability）。
      properties:
        effective_from:
          description: 生效起始日期；旧版本保留，按日期选择
          format: date
          title: Effective From
          type: string
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
        weekly_minutes:
          additionalProperties:
            type: integer
          description: 周一至周日七个额度（分钟），键为 monday…sunday
          title: Weekly Minutes
          type: object
      required:
      - expected_revision
      - effective_from
      - weekly_minutes
      title: UpdateAvailabilityRequest
      type: object
    UpdateDraftTaskRequest:
      properties:
        expected_minutes:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Expected Minutes
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
        instructions:
          anyOf:
          - maxLength: 8000
            type: string
          - type: 'null'
          title: Instructions
        maximum_minutes:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Maximum Minutes
        minimum_minutes:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Minimum Minutes
        title:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
          - type: 'null'
          title: Title
      required:
      - expected_revision
      title: UpdateDraftTaskRequest
      type: object
    UpdateProfileDraftRequest:
      properties:
        edits:
          additionalProperties: true
          description: 用户对草稿的直接编辑；基于旧档案的模型预览将标记 stale（05 第 2 节）
          title: Edits
          type: object
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
      required:
      - expected_revision
      - edits
      title: UpdateProfileDraftRequest
      type: object
    UpdateSchedulingPreferencesRequest:
      description: 一次提交全部活动目标的 focus 状态与顺序（13 号第 8 节）。
      properties:
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
        preferences:
          items:
            $ref: '#/components/schemas/PreferenceInput'
          minItems: 1
          title: Preferences
          type: array
      required:
      - expected_revision
      - preferences
      title: UpdateSchedulingPreferencesRequest
      type: object
    UserRole:
      description: 账号角色。首位注册者不自动成为管理员，只能由部署者本地命令授予。
      enum:
      - user
      - admin
      title: UserRole
      type: string
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  description: GoalFlow 的 HTTP 契约事实源。本文档由 scripts/api-generate.sh 导出，禁止手工编辑。
  title: GoalFlow API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/agendas/{local_date}:
    get:
      description: 返回当前安排或缺失状态；读取不直接创建作业（05-module-contracts read_today）。
      operationId: read_agenda_api_agendas__local_date__get
      parameters:
      - description: 用户本地日期，格式 YYYY-MM-DD
        in: path
        name: local_date
        required: true
        schema:
          description: 用户本地日期，格式 YYYY-MM-DD
          format: date
          title: Local Date
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录或会话失效
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 日程、任务、目标或相关资源不存在，或不属于当前用户
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 读取某日安排
      tags:
      - scheduling
  /api/agendas/{local_date}/generation:
    post:
      description: 保证该日期存在基于最新 planning revision 的安排；已有有效安排则去重返回（13 号第 8 节）。异步：返回 202 与作业引用。
      operationId: ensure_agenda_api_agendas__local_date__generation_post
      parameters:
