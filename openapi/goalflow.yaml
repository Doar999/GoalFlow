          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录或会话失效
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求来源不受信任
        '404':
