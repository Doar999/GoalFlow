components:
  schemas:
    AccountUser:
      properties:
        account_identifier:
          description: 规范化后的账号标识
          title: Account Identifier
          type: string
        id:
          title: Id
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        timezone:
          description: IANA 时区名
          title: Timezone
          type: string
      required:
      - id
      - account_identifier
      - role
      - timezone
      title: AccountUser
      type: object
    ActivatePlanRequest:
      properties:
        draft_plan_id:
          maxLength: 36
          title: Draft Plan Id
          type: string
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
        planning_revision:
          description: 客户端读到的 planning revision；过期返回 INPUT_STALE
          minimum: 0.0
          title: Planning Revision
          type: integer
      required:
      - expected_revision
      - draft_plan_id
      - planning_revision
      title: ActivatePlanRequest
      type: object
    ActivationResponse:
      description: 启用结果。幂等：重复请求返回同一结果，不重复创建任务（12 号第 7 节）。
      properties:
        activated_at:
          format: date-time
          title: Activated At
          type: string
        first_batch_window:
          additionalProperties: true
          description: 首个批次的 window_start / window_end
          title: First Batch Window
          type: object
        goal_id:
          title: Goal Id
          type: string
        plan_version_id:
          description: 切换为 active 的计划版本；目标状态同步 draft → active（T04 决策 A10）
          title: Plan Version Id
          type: string
      required:
      - goal_id
      - plan_version_id
      - first_batch_window
      - activated_at
      title: ActivationResponse
      type: object
    AffectedDependency:
      description: 暂停目标时受影响的跨目标依赖项。取值由 T06 的依赖图计算，接入前恒为空列表（T04 决策 A12）。
      properties:
        goal_id:
          description: 依赖方（后继任务）所属目标
          title: Goal Id
          type: string
        task_id:
          description: 将被计算态 blocked 的后继任务
          title: Task Id
          type: string
      required:
      - goal_id
      - task_id
      title: AffectedDependency
      type: object
    AuthSessionResponse:
      description: 当前用户与会话元数据。不包含会话令牌。
      properties:
        session:
          $ref: '#/components/schemas/SessionInfo'
        user:
          $ref: '#/components/schemas/AccountUser'
      required:
      - user
      - session
      title: AuthSessionResponse
      type: object
    CancelJobRequest:
      properties:
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
      required:
      - expected_revision
      title: CancelJobRequest
      type: object
    ChangePasswordRequest:
      properties:
        current_password:
          format: password
          maxLength: 1024
          title: Current Password
          type: string
          writeOnly: true
        new_password:
          description: 12–128 个字符，不得与账号标识相同
          format: password
          maxLength: 1024
          title: New Password
          type: string
          writeOnly: true
      required:
      - current_password
      - new_password
      title: ChangePasswordRequest
      type: object
    CloseGoalRequest:
      properties:
        closure_kind:
          $ref: '#/components/schemas/ClosureKind'
        criteria_confirmations:
          description: 成功标准逐条确认；随结束操作写入快照，撤销后可还原（17 号第 4 节）
          items:
            $ref: '#/components/schemas/CriterionConfirmation'
          title: Criteria Confirmations
          type: array
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
        note:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Note
      required:
      - expected_revision
      - closure_kind
      - criteria_confirmations
      title: CloseGoalRequest
      type: object
    ClosureKind:
      description: 结束方式。completed 仅对 kind=achievement 开放（17 号第 2 节）。
      enum:
      - completed
      - stopped
      title: ClosureKind
      type: string
    ConfirmProfileRequest:
      properties:
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
      required:
      - expected_revision
      title: ConfirmProfileRequest
      type: object
    CreateGoalRequest:
      properties:
        initial_description:
          anyOf:
          - maxLength: 8000
            type: string
          - type: 'null'
          description: 自然语言目标描述，作为澄清对话的起点（R02）
          title: Initial Description
        title:
          maxLength: 200
          minLength: 1
          title: Title
          type: string
      required:
      - title
      title: CreateGoalRequest
      type: object
    CriterionConfirmation:
      description: 结束目标时对单条成功标准的确认。快照整体写入 goals.closure_criteria_snapshot_json（T04 决策 A8）。
      properties:
        criterion_key:
          description: 成功标准的标识，来自已确认档案的 success_criteria
          title: Criterion Key
          type: string
        met:
          description: 该标准是否已达成；允许部分达成时标记完成并记录未达成项（D12 第 3 节）
          title: Met
          type: boolean
        note:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          description: 对未达成项的记录说明
          title: Note
      required:
      - criterion_key
      - met
      title: CriterionConfirmation
      type: object
    DependencyCheckStatus:
      description: '暂停响应中跨目标依赖影响的检查标记（T04 决策 A12）。


        not_wired 表示依赖校验尚未接入（T06 建 task_dependencies 前），此时影响列表为空

        仅因"未检查"，不代表"无影响"。'
      enum:
      - wired
      - not_wired
      title: DependencyCheckStatus
      type: string
    DeriveGoalRequest:
      properties:
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
      required:
      - expected_revision
      title: DeriveGoalRequest
      type: object
    DerivedMetric:
      description: 服务端计算的路线派生指标，模型不能覆盖（11 号第 4 节）。
      properties:
        available_weekly_minutes:
          title: Available Weekly Minutes
          type: integer
        budget_gap_minutes:
          title: Budget Gap Minutes
          type: integer
        conflicts:
          description: 预算、期限或与其他目标的冲突
          items:
            additionalProperties: true
            type: object
          title: Conflicts
          type: array
        peak_weekly_minutes:
          title: Peak Weekly Minutes
          type: integer
        recommendation_eligible:
          title: Recommendation Eligible
          type: boolean
        total_estimated_minutes:
          title: Total Estimated Minutes
          type: integer
      required:
      - total_estimated_minutes
      - peak_weekly_minutes
      - available_weekly_minutes
      - budget_gap_minutes
      - recommendation_eligible
      title: DerivedMetric
      type: object
    DraftTaskResponse:
      description: 计划草稿中的任务。draft 计划的任务为 proposed，不出现在正式待办（R05）。
      properties:
        batch_window:
          additionalProperties: true
          description: 所属批次的 window_start / window_end
          title: Batch Window
          type: object
        can_split:
          title: Can Split
          type: boolean
        earliest_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Earliest Date
        execution_status:
          $ref: '#/components/schemas/TaskExecutionStatus'
        executor:
          $ref: '#/components/schemas/TaskExecutor'
        expected_minutes:
          minimum: 0.0
          title: Expected Minutes
          type: integer
        latest_date:
          description: 非空；由计划生成时推导（05-module-contracts 默认值表）
          format: date
          title: Latest Date
          type: string
        maximum_minutes:
          minimum: 0.0
          title: Maximum Minutes
          type: integer
        milestone_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Milestone Id
        minimum_minutes:
          minimum: 0.0
          title: Minimum Minutes
          type: integer
        minimum_session_minutes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Minimum Session Minutes
        phase_id:
          title: Phase Id
          type: string
        revision:
          description: 服务端当前版本号
          minimum: 0.0
          title: Revision
          type: integer
        spec_no:
          description: 内容版本号；草稿编辑产生新 spec，原 spec 保留
          minimum: 1.0
          title: Spec No
          type: integer
        task_id:
          title: Task Id
          type: string
        title:
          title: Title
          type: string
      required:
      - revision
      - task_id
      - spec_no
      - title
      - executor
      - expected_minutes
      - minimum_minutes
      - maximum_minutes
      - can_split
      - minimum_session_minutes
      - earliest_date
      - latest_date
      - execution_status
      - phase_id
      - milestone_id
      - batch_window
      title: DraftTaskResponse
      type: object
    ErrorCode:
      description: 对外错误码。
      enum:
      - VALIDATION_FAILED
      - UNAUTHENTICATED
      - FORBIDDEN
      - NOT_FOUND
      - INTERNAL_ERROR
      - RATE_LIMITED
      - INVALID_CREDENTIALS
      - ACCOUNT_IDENTIFIER_UNAVAILABLE
      - REGISTRATION_CLOSED
      - IDEMPOTENCY_KEY_CONFLICT
      - REVISION_CONFLICT
      - BUDGET_CONFLICT
      - DEPENDENCY_CYCLE
      - CONFIRMATION_REQUIRED
      - INPUT_STALE
      - MODEL_UNAVAILABLE
      - GOAL_STATE_CONFLICT
      title: ErrorCode
      type: string
    ErrorResponse:
      description: 所有 API 错误的唯一响应体。各模块不得自定义错误体。
      example:
        code: REVISION_CONFLICT
        details: {}
        message: 计划版本已过期，请刷新后重试
        request_id: req_0000000000
        retryable: false
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: 错误码，取自 contracts.errors.ErrorCode 单点定义
        details:
          additionalProperties: true
          description: 补充信息。不含其他用户的数据，也不含模型凭证或其片段。
          title: Details
          type: object
        message:
          description: 面向用户的可读说明
          title: Message
          type: string
        request_id:
          description: 本次请求标识，与响应头 X-Request-Id 一致
          title: Request Id
          type: string
        retryable:
          description: 原样重试是否有意义
          title: Retryable
          type: boolean
      required:
      - code
      - message
      - request_id
      - retryable
      title: ErrorResponse
      type: object
    GeneratePlanRequest:
      properties:
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
        route_id:
          description: 最终选定的路线
          maxLength: 36
          title: Route Id
          type: string
        start_date:
          description: 计划开始日；开始日容量不足时草稿照常保存并返回建议前移日期（12 号第 2 节）
          format: date
          title: Start Date
          type: string
      required:
      - expected_revision
      - route_id
      - start_date
      title: GeneratePlanRequest
      type: object
    GenerateRoutesRequest:
      properties:
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
        profile_id:
          description: 用于生成的已确认档案
          maxLength: 36
          title: Profile Id
          type: string
      required:
      - expected_revision
      - profile_id
      title: GenerateRoutesRequest
      type: object
    GoalDomain:
      description: 'Agent 的内部策略路由，不是用户必填标签（03 第 2 节）。


        推断不足时使用 general。取值见 16-domain-policy-design.md 第 2 节。'
      enum:
      - general
      - learning
      - fitness
      title: GoalDomain
      type: string
    GoalKind:
      description: '目标形态，由档案的时间边界推导（PRD D12 已确认）。


        completed 状态仅对 achievement 开放；maintenance 永不进入 completed。'
      enum:
      - achievement
      - maintenance
      title: GoalKind
      type: string
    GoalResponse:
      description: 目标当前状态。生命周期字段的语义见 12-goal-lifecycle.md（D12）。
      properties:
        active_profile_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Active Profile Id
        closed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Closed At
        closure_kind:
          anyOf:
          - $ref: '#/components/schemas/ClosureKind'
          - type: 'null'
        closure_note:
          anyOf:
          - type: string
          - type: 'null'
          title: Closure Note
        created_at:
          format: date-time
          title: Created At
          type: string
        current_plan_version_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Plan Version Id
        domain:
          $ref: '#/components/schemas/GoalDomain'
          description: Agent 的内部策略路由，不是用户必填标签
        domain_confidence:
          anyOf:
          - type: number
          - type: 'null'
          description: 领域推断置信度，0–1；未推断时为空
          title: Domain Confidence
        id:
          title: Id
          type: string
        kind:
          $ref: '#/components/schemas/GoalKind'
          description: 目标形态，由档案时间边界推导，随档案确认
        pause_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Pause Reason
        paused_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Paused At
        review_period:
          $ref: '#/components/schemas/ReviewPeriod'
          description: 维持型目标的回顾周期；达成型同样存储，不参与回顾
        revision:
          description: 服务端当前版本号
          minimum: 0.0
          title: Revision
          type: integer
        source_goal_id:
          anyOf:
          - type: string
          - type: 'null'
          description: 非空表示本目标由该目标'以此为起点新建'派生而来
          title: Source Goal Id
        status:
          $ref: '#/components/schemas/GoalStatus'
        title:
          title: Title
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - revision
      - id
      - title
      - domain
      - domain_confidence
      - kind
      - status
      - review_period
      - active_profile_id
      - current_plan_version_id
      - source_goal_id
      - paused_at
      - pause_reason
      - closed_at
      - closure_kind
      - closure_note
      - created_at
      - updated_at
      title: GoalResponse
      type: object
    GoalStatus:
      description: '目标状态机（PRD D12；17-goal-lifecycle-design.md 第 2 节）。


        draft → active ↔ paused；completed / stopped 是终态，不可逆，

        仅结束操作后 24 小时内可经 undo_closure 回到结束前状态。'
      enum:
      - draft
      - active
      - paused
      - completed
      - stopped
      title: GoalStatus
      type: string
    GoalTransitionResponse:
      description: 暂停/恢复响应：目标状态 + 依赖影响。
      properties:
        active_profile_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Active Profile Id
        affected_dependent_tasks:
          description: 受本次暂停影响、将进入计算态 blocked 的他目标任务；仅在暂停操作中返回内容
          items:
            $ref: '#/components/schemas/AffectedDependency'
          title: Affected Dependent Tasks
          type: array
        closed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Closed At
        closure_kind:
          anyOf:
          - $ref: '#/components/schemas/ClosureKind'
          - type: 'null'
        closure_note:
          anyOf:
          - type: string
          - type: 'null'
          title: Closure Note
        created_at:
          format: date-time
          title: Created At
          type: string
        current_plan_version_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Plan Version Id
        dependency_check:
          $ref: '#/components/schemas/DependencyCheckStatus'
          description: 依赖校验是否已接入。not_wired 时列表为空仅因'未检查'，不代表'无影响'
        domain:
          $ref: '#/components/schemas/GoalDomain'
          description: Agent 的内部策略路由，不是用户必填标签
        domain_confidence:
          anyOf:
          - type: number
          - type: 'null'
          description: 领域推断置信度，0–1；未推断时为空
          title: Domain Confidence
        id:
          title: Id
          type: string
        kind:
          $ref: '#/components/schemas/GoalKind'
          description: 目标形态，由档案时间边界推导，随档案确认
        pause_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Pause Reason
        paused_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Paused At
        review_period:
          $ref: '#/components/schemas/ReviewPeriod'
          description: 维持型目标的回顾周期；达成型同样存储，不参与回顾
        revision:
          description: 服务端当前版本号
          minimum: 0.0
          title: Revision
          type: integer
        source_goal_id:
          anyOf:
          - type: string
          - type: 'null'
          description: 非空表示本目标由该目标'以此为起点新建'派生而来
          title: Source Goal Id
        status:
          $ref: '#/components/schemas/GoalStatus'
        title:
          title: Title
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - revision
      - id
      - title
      - domain
      - domain_confidence
      - kind
      - status
      - review_period
      - active_profile_id
      - current_plan_version_id
      - source_goal_id
      - paused_at
      - pause_reason
      - closed_at
      - closure_kind
      - closure_note
      - created_at
      - updated_at
      - affected_dependent_tasks
      - dependency_check
      title: GoalTransitionResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthResponse:
      properties:
        status:
          const: ok
          description: 进程可响应请求时固定为 ok
          title: Status
          type: string
      required:
      - status
      title: HealthResponse
      type: object
    JobEventMessage:
      description: 事件流里每条消息的 data 字段（JSON）。SSE 的 id 为 sequence，event 为 type。
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        payload:
          additionalProperties: true
          description: 随事件类型而定，例如 stage_completed 带 stage 名
          title: Payload
          type: object
        sequence:
          description: 单个作业内从 1 起连续递增；断线重连时作为 Last-Event-ID 发回
          minimum: 1.0
          title: Sequence
          type: integer
        type:
          $ref: '#/components/schemas/JobEventType'
          description: completed、failed、cancelled、stale 是终态事件，收到后流随即结束
      required:
      - sequence
      - type
      - payload
      - created_at
      title: JobEventMessage
      type: object
    JobEventType:
      description: '作业持久化事件（T07 决策 E19），SSE 按 sequence 补读。


        completed、failed、cancelled、stale 是终态事件，订阅方收到后即可关闭连接。'
      enum:
      - queued
      - started
      - stage_completed
      - awaiting_confirmation
      - retrying
      - completed
      - failed
      - cancelled
      - stale
      title: JobEventType
      type: string
    JobResponse:
      description: 作业的当前状态。只含展示与恢复所需的字段，不含输入快照。
      properties:
        attempts:
          description: 已经开始过的尝试次数，最多 3 次
          minimum: 0.0
          title: Attempts
          type: integer
        cancel_requested:
          description: 已请求取消但作业仍在运行，等待 Worker 在下一个检查点停下
          title: Cancel Requested
          type: boolean
        created_at:
          format: date-time
          title: Created At
          type: string
        error_code:
          anyOf:
          - $ref: '#/components/schemas/ErrorCode'
          - type: 'null'
          description: 失败、重试等待或过期时的错误码
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          description: 面向用户的错误说明
          title: Error Message
        finished_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Finished At
        id:
          title: Id
          type: string
        kind:
          description: 作业种类，由提交它的业务模块定义
          title: Kind
          type: string
        result_refs:
          description: 成功后产出的资源引用；未成功时为空
          items:
            $ref: '#/components/schemas/JobResultRef'
          title: Result Refs
          type: array
        revision:
          description: 服务端当前版本号
          minimum: 0.0
          title: Revision
          type: integer
        status:
          $ref: '#/components/schemas/JobStatus'
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - revision
      - id
      - kind
      - status
      - attempts
      - result_refs
      - error_code
      - error_message
      - cancel_requested
      - created_at
      - updated_at
      - finished_at
      title: JobResponse
      type: object
    JobResultRef:
      properties:
        id:
          title: Id
          type: string
        type:
          description: 结果资源的类型，例如 route_set
          title: Type
          type: string
      required:
      - type
      - id
      title: JobResultRef
      type: object
    JobStatus:
      description: '后台作业状态（T07 决策 E9）。


        queued → running → succeeded / failed / cancelled / stale；可重试错误经 retry_wait 回到 queued。

        后四个是终态，进入后不再变化。等待用户确认属于业务会话状态，不是作业状态。'
      enum:
      - queued
      - running
      - retry_wait
      - succeeded
      - failed
      - cancelled
      - stale
      title: JobStatus
      type: string
    LoginRequest:
      properties:
        account_identifier:
          maxLength: 1024
          title: Account Identifier
          type: string
        password:
          format: password
          maxLength: 1024
          title: Password
          type: string
          writeOnly: true
      required:
      - account_identifier
      - password
      title: LoginRequest
      type: object
    PauseGoalRequest:
      properties:
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
        reason:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          description: 暂停原因；记录但不设自动恢复
          title: Reason
      required:
      - expected_revision
      title: PauseGoalRequest
      type: object
    PlanChangeRequest:
      properties:
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
        request_text:
          anyOf:
          - maxLength: 4000
            type: string
          - type: 'null'
          description: 自然语言修改
          title: Request Text
        structured_patch:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: 结构化修改；与 request_text 至少一项
          title: Structured Patch
      required:
      - expected_revision
      title: PlanChangeRequest
      type: object
    PlanDraftResponse:
      description: 计划草稿：完整阶段与里程碑、开始日起七天详细任务、冲突与 stale 状态（R05、12 号第 8 节）。
      properties:
        conflicts:
          description: 预算、期限、开始日容量等结构化冲突
          items:
            additionalProperties: true
            type: object
          title: Conflicts
          type: array
        detailed_through_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: 详细任务已覆盖到的日期；早于 today+3 天时触发滚动展开
          title: Detailed Through Date
        goal_id:
          title: Goal Id
          type: string
        horizon_end:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: 达成型非空且展开不得越过；维持型可空
          title: Horizon End
        milestones:
          items:
            $ref: '#/components/schemas/PlanMilestoneResponse'
          title: Milestones
          type: array
        phases:
          items:
            $ref: '#/components/schemas/PlanPhaseResponse'
          title: Phases
          type: array
        plan_version_id:
          title: Plan Version Id
          type: string
        revision:
          description: 服务端当前版本号
          minimum: 0.0
          title: Revision
          type: integer
        stale:
          description: 生成输入的 revision 已变化，结果需重新生成
          title: Stale
          type: boolean
        stale_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Stale Reason
        start_date:
          format: date
          title: Start Date
          type: string
        status:
          $ref: '#/components/schemas/PlanVersionStatus'
        tasks:
          description: 首个有效批次的详细任务
          items:
            $ref: '#/components/schemas/DraftTaskResponse'
          title: Tasks
          type: array
      required:
      - revision
      - plan_version_id
      - goal_id
      - status
      - start_date
      - horizon_end
      - detailed_through_date
      - phases
      - milestones
      - tasks
      - conflicts
      - stale
      - stale_reason
      title: PlanDraftResponse
      type: object
    PlanMilestoneResponse:
      properties:
        milestone_key:
          title: Milestone Key
          type: string
        phase_id:
          title: Phase Id
          type: string
        rank:
          minimum: 1.0
          title: Rank
          type: integer
        success_criteria:
          items:
            additionalProperties: true
            type: object
          title: Success Criteria
          type: array
        target_window:
          additionalProperties: true
          title: Target Window
          type: object
        title:
          title: Title
          type: string
      required:
      - milestone_key
      - phase_id
      - rank
      - title
      - success_criteria
      - target_window
      title: PlanMilestoneResponse
      type: object
    PlanPhaseResponse:
      properties:
        duration_estimate:
          additionalProperties: true
          title: Duration Estimate
          type: object
        exit_criteria:
          items:
            additionalProperties: true
            type: object
          title: Exit Criteria
          type: array
        outcome:
          title: Outcome
          type: string
        phase_key:
          title: Phase Key
          type: string
        rank:
          minimum: 1.0
          title: Rank
          type: integer
        title:
          title: Title
          type: string
      required:
      - phase_key
      - rank
      - title
      - outcome
      - exit_criteria
      - duration_estimate
      title: PlanPhaseResponse
      type: object
    PlanVersionStatus:
      description: 计划版本状态（03 第 3 节）。战略结构不可变；正常滚动展开不创建新版本。
      enum:
      - draft
      - active
      - superseded
      - discarded
      title: PlanVersionStatus
      type: string
    ProfileDraftReadiness:
      description: 档案草稿的就绪状态（03 第 2 节）。
      enum:
      - needs_input
      - review_ready
      - blocked
      title: ProfileDraftReadiness
      type: string
    ProfileDraftResponse:
      description: 档案草稿。事实、推断、假设和未知可区分（R02）。
      properties:
        assumptions:
          description: 已采用但未经用户确认的假设
          items:
            additionalProperties: true
            type: object
          title: Assumptions
          type: array
        content:
          additionalProperties: true
          description: 草稿正文，结构由澄清引擎版本决定
          title: Content
          type: object
        contradictions:
          description: 检测到的陈述矛盾
          items:
            additionalProperties: true
            type: object
          title: Contradictions
          type: array
        gaps:
          description: 尚缺的关键事实
          items:
            additionalProperties: true
            type: object
          title: Gaps
          type: array
        goal_id:
          title: Goal Id
          type: string
        readiness:
          $ref: '#/components/schemas/ProfileDraftReadiness'
        revision:
          description: 服务端当前版本号
          minimum: 0.0
          title: Revision
          type: integer
        source_map:
          additionalProperties: true
          description: 各字段来源：用户陈述、推断或建议
          title: Source Map
          type: object
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - revision
      - goal_id
      - content
      - source_map
      - gaps
      - assumptions
      - contradictions
      - readiness
      - updated_at
      title: ProfileDraftResponse
      type: object
    ProfileResponse:
      description: 不可变的已确认档案版本。
      properties:
        baseline:
          additionalProperties: true
          title: Baseline
          type: object
        confirmed_at:
          format: date-time
          title: Confirmed At
          type: string
        constraints:
          additionalProperties: true
          title: Constraints
          type: object
        facts:
          additionalProperties: true
          description: 用户事实、假设、建议分别带来源与确认状态
          title: Facts
          type: object
        goal_id:
          title: Goal Id
          type: string
        id:
          title: Id
          type: string
        result_definition:
          title: Result Definition
          type: string
        success_criteria:
          description: 成功标准逐条列表，含标识与验证方式
          items:
            additionalProperties: true
            type: object
          title: Success Criteria
          type: array
        version_no:
          minimum: 1.0
          title: Version No
          type: integer
      required:
      - id
      - goal_id
      - version_no
      - result_definition
      - success_criteria
      - baseline
      - constraints
      - facts
      - confirmed_at
      title: ProfileResponse
      type: object
    RegisterRequest:
      properties:
        account_identifier:
          description: 账号标识，可以是用户名或邮箱格式（首版不验证邮箱）。规范化后需为 3–254 个字符，不含空白
          maxLength: 1024
          title: Account Identifier
          type: string
        password:
          description: 12–128 个字符，不得与账号标识相同
          format: password
          maxLength: 1024
          title: Password
          type: string
          writeOnly: true
        timezone:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          description: IANA 时区名，例如 Asia/Shanghai。省略时为 UTC
          title: Timezone
      required:
      - account_identifier
      - password
      title: RegisterRequest
      type: object
    RegistrationStatusResponse:
      properties:
        registration_open:
          description: 本实例是否接受新用户注册。关闭后已有用户仍可登录
          title: Registration Open
          type: boolean
      required:
      - registration_open
      title: RegistrationStatusResponse
      type: object
    ResetPasswordRequest:
      properties:
        new_password:
          description: 12–128 个字符，不得与账号标识相同
          format: password
          maxLength: 1024
          title: New Password
          type: string
          writeOnly: true
        token:
          description: 部署者用本地命令签发的一次性重置令牌
          format: password
          maxLength: 1024
          title: Token
          type: string
          writeOnly: true
      required:
      - token
      - new_password
      title: ResetPasswordRequest
      type: object
    ResumeGoalRequest:
      properties:
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
      required:
      - expected_revision
      title: ResumeGoalRequest
      type: object
    ReviewPeriod:
      description: 维持型目标的周期回顾节奏（12-goal-lifecycle.md 第 4 节，默认 weekly）。
      enum:
      - weekly
      - biweekly
      - monthly
      title: ReviewPeriod
      type: string
    RouteResponse:
      description: 结构化路线（11 号第 4 节）。
      properties:
        approach:
          title: Approach
          type: string
        assumptions:
          items:
            additionalProperties: true
            type: object
          title: Assumptions
          type: array
        based_on_route_id:
          anyOf:
          - type: string
          - type: 'null'
          description: 非空表示由该路线微调产生的变体
          title: Based On Route Id
        created_at:
          format: date-time
          title: Created At
          type: string
        derived_metrics:
          $ref: '#/components/schemas/DerivedMetric'
        difference_keys:
          description: 与其他候选的差异维度，取自受控枚举（11 号第 5 节）
          items:
            type: string
          title: Difference Keys
          type: array
        duration_range:
          additionalProperties: true
          title: Duration Range
          type: object
        id:
          title: Id
          type: string
        phase_outline:
          description: 每阶段成果、预计周数及每周分钟数
          items:
            additionalProperties: true
            type: object
          title: Phase Outline
          type: array
        required_resources:
          items:
            additionalProperties: true
            type: object
          title: Required Resources
          type: array
        revision:
          description: 服务端当前版本号
          minimum: 0.0
          title: Revision
          type: integer
        risks:
          items:
            additionalProperties: true
            type: object
          title: Risks
          type: array
        route_set_id:
          title: Route Set Id
          type: string
        status:
          $ref: '#/components/schemas/RouteStatus'
        title:
          title: Title
          type: string
        tradeoffs:
          items:
            additionalProperties: true
            type: object
          title: Tradeoffs
          type: array
        weekly_minutes:
          minimum: 0.0
          title: Weekly Minutes
          type: integer
      required:
      - revision
      - id
      - route_set_id
      - status
      - based_on_route_id
      - title
      - approach
      - difference_keys
      - duration_range
      - phase_outline
      - weekly_minutes
      - tradeoffs
      - risks
      - assumptions
      - required_resources
      - derived_metrics
      - created_at
      title: RouteResponse
      type: object
    RouteSelectionResponse:
      description: 路线选择结果。选择动作不创建正式任务（11 号第 7 节）。
      properties:
        goal_id:
          title: Goal Id
          type: string
        revision:
          description: 服务端当前版本号
          minimum: 0.0
          title: Revision
          type: integer
        route_id:
          title: Route Id
          type: string
        selected_at:
          format: date-time
          title: Selected At
          type: string
      required:
      - revision
      - goal_id
      - route_id
      - selected_at
      title: RouteSelectionResponse
      type: object
    RouteSetResponse:
      description: 当前可比较的整组路线与派生冲突（11 号第 8 节）。
      properties:
        availability_revision:
          description: 生成时所处的可用时间版本
          title: Availability Revision
          type: integer
        created_at:
          format: date-time
          title: Created At
          type: string
        goal_id:
          title: Goal Id
          type: string
        id:
          title: Id
          type: string
        invalidated_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Invalidated Reason
        planning_revision:
          description: 生成时所处的 planning revision；与当前值不一致即为 stale
          title: Planning Revision
          type: integer
        profile_id:
          title: Profile Id
          type: string
        revision:
          description: 服务端当前版本号
          minimum: 0.0
          title: Revision
          type: integer
        routes:
          items:
            $ref: '#/components/schemas/RouteResponse'
          title: Routes
          type: array
        status:
          $ref: '#/components/schemas/RouteSetStatus'
      required:
      - revision
      - id
      - goal_id
      - profile_id
      - status
      - invalidated_reason
      - planning_revision
      - availability_revision
      - routes
      - created_at
      title: RouteSetResponse
      type: object
    RouteSetStatus:
      description: 路线集合状态。新集合不覆盖旧集合；输入 revision 变化使晚返回结果 stale（11 号第 3、6 节）。
      enum:
      - current
      - superseded
      - stale
      - failed
      title: RouteSetStatus
      type: string
    RouteStatus:
      description: 单条路线状态。微调创建 based_on_route_id 指向原路线的新变体（11 号第 6 节）。
      enum:
      - current
      - superseded
      title: RouteStatus
      type: string
    RouteVariantRequest:
      properties:
        adjustment:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: 结构化微调；与 natural_language 二选一
          title: Adjustment
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
        natural_language:
          anyOf:
          - maxLength: 4000
            type: string
          - type: 'null'
          description: 自然语言微调要求
          title: Natural Language
        route_id:
          maxLength: 36
          title: Route Id
          type: string
      required:
      - expected_revision
      - route_id
      title: RouteVariantRequest
      type: object
    SelectRouteRequest:
      properties:
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
        route_id:
          maxLength: 36
          title: Route Id
          type: string
      required:
      - expected_revision
      - route_id
      title: SelectRouteRequest
      type: object
    SessionInfo:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        expires_at:
          description: 绝对过期时间。7 天无活动会更早失效
          format: date-time
          title: Expires At
          type: string
      required:
      - created_at
      - expires_at
      title: SessionInfo
      type: object
    TaskExecutionStatus:
      description: '任务执行状态（03 第 3 节）。


        blocked 是排期计算得到的展示态，不落库；paused 目标下的任务不改写执行状态（D12）。'
      enum:
      - proposed
      - pending
      - in_progress
      - completed
      - cancelled
      title: TaskExecutionStatus
      type: string
    TaskExecutor:
      description: 任务的执行者类型（12 号第 4 节：用户任务、Agent 任务和协作任务分别计算用户投入）。
      enum:
      - user
      - agent
      - collaborative
      title: TaskExecutor
      type: string
    UndoClosureRequest:
      properties:
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
      required:
      - expected_revision
      title: UndoClosureRequest
      type: object
    UpdateDraftTaskRequest:
      properties:
        expected_minutes:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Expected Minutes
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
        instructions:
          anyOf:
          - maxLength: 8000
            type: string
          - type: 'null'
          title: Instructions
        maximum_minutes:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Maximum Minutes
        minimum_minutes:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Minimum Minutes
        title:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
          - type: 'null'
          title: Title
      required:
      - expected_revision
      title: UpdateDraftTaskRequest
      type: object
    UpdateProfileDraftRequest:
      properties:
        edits:
          additionalProperties: true
          description: 用户对草稿的直接编辑；基于旧档案的模型预览将标记 stale（05 第 2 节）
          title: Edits
          type: object
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
      required:
      - expected_revision
      - edits
      title: UpdateProfileDraftRequest
      type: object
    UserRole:
      description: 账号角色。首位注册者不自动成为管理员，只能由部署者本地命令授予。
      enum:
      - user
      - admin
      title: UserRole
      type: string
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  description: GoalFlow 的 HTTP 契约事实源。本文档由 scripts/api-generate.sh 导出，禁止手工编辑。
  title: GoalFlow API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/auth/login:
    post:
      description: 账号不存在、密码错误、账号已禁用统一返回 INVALID_CREDENTIALS。已登录时再次登录会撤销旧会话。
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录、会话失效或凭证错误
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求来源不受信任，或本实例已关闭注册
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求参数校验未通过
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 尝试次数过多，响应头 Retry-After 给出需等待的秒数
      summary: 登录
      tags:
      - auth
  /api/auth/logout:
    post:
      description: 未登录或会话已失效时同样返回 204。
      operationId: logout_api_auth_logout_post
      responses:
        '204':
          description: Successful Response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求来源不受信任，或本实例已关闭注册
      summary: 退出当前会话
      tags:
      - auth
  /api/auth/logout-all:
    post:
      description: 撤销该用户的全部会话，包括当前会话。
      operationId: logout_all_api_auth_logout_all_post
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录、会话失效或凭证错误
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求来源不受信任，或本实例已关闭注册
