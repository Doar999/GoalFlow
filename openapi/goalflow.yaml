  /api/jobs/{job_id}/events:
    get:
      description: text/event-stream。每条消息的 id 为 sequence、event 为事件类型、data 为 JobEventMessage 的 JSON。先补发
        Last-Event-ID 之后的全部持久化事件，再持续推送新事件；收到终态事件后服务端关闭连接。无新事件时每 15 秒发一行注释作为心跳；单条连接最长 5 分钟，之后由客户端重连。断开连接不会取消作业。
      operationId: watch_job_api_jobs__job_id__events_get
      parameters:
      - description: 作业 ID
        in: path
        name: job_id
        required: true
        schema:
          description: 作业 ID
          maxLength: 36
          title: Job Id
          type: string
      - description: 已收到的最后一个 sequence；浏览器重连时自动携带
        in: header
        name: Last-Event-ID
        required: false
        schema:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          description: 已收到的最后一个 sequence；浏览器重连时自动携带
          title: Last-Event-Id
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/JobEventMessage'
                type: string
          description: 事件流；schema 描述的是每条消息的 data
        '401':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录或会话失效
        '404':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 作业不存在，或不属于当前用户
        '422':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求参数校验未通过
      summary: 订阅作业事件（SSE）
      tags:
      - jobs
