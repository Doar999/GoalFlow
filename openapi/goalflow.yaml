components:
  schemas:
    AccountUser:
      properties:
        account_identifier:
          description: 规范化后的账号标识
          title: Account Identifier
          type: string
        id:
          title: Id
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        timezone:
          description: IANA 时区名
          title: Timezone
          type: string
      required:
      - id
      - account_identifier
      - role
      - timezone
      title: AccountUser
      type: object
    ActivatePlanRequest:
      properties:
        draft_plan_id:
          maxLength: 36
          title: Draft Plan Id
          type: string
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
        planning_revision:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          description: 客户端读到的 planning revision；T05 交付前可省略（省略时跳过 stale 判定）
          title: Planning Revision
      required:
      - expected_revision
      - draft_plan_id
      title: ActivatePlanRequest
      type: object
    ActivationResponse:
      description: 启用结果。幂等：重复请求返回同一结果，不重复创建任务（12 号第 7 节）。
      properties:
        activated_at:
          format: date-time
          title: Activated At
          type: string
        first_batch_window:
          additionalProperties: true
          description: 首个批次的 window_start / window_end
          title: First Batch Window
          type: object
        goal_id:
          title: Goal Id
          type: string
        plan_version_id:
          description: 切换为 active 的计划版本；目标状态同步 draft → active（T04 决策 A10）
          title: Plan Version Id
          type: string
      required:
      - goal_id
      - plan_version_id
      - first_batch_window
      - activated_at
      title: ActivationResponse
      type: object
    AffectedDependency:
      description: 暂停目标时受影响的跨目标依赖项。取值由 T06 的依赖图计算，接入前恒为空列表（T04 决策 A12）。
      properties:
        goal_id:
          description: 依赖方（后继任务）所属目标
          title: Goal Id
          type: string
        task_id:
          description: 将被计算态 blocked 的后继任务
          title: Task Id
          type: string
      required:
      - goal_id
      - task_id
      title: AffectedDependency
      type: object
    AgendaItemView:
      description: 当日一个任务的分配（13 号第 1 节 agenda_items）。首版没有起止时刻（R06）。
      properties:
        allocated_minutes:
          description: 分配分钟数；不超过任务剩余预计分钟
          exclusiveMinimum: 0.0
          title: Allocated Minutes
          type: integer
        rank:
          description: 当日执行顺序
          minimum: 1.0
          title: Rank
          type: integer
        reason_codes:
          description: 排序键、所选层级及原因码（13 号第 4 节）
          items:
            $ref: '#/components/schemas/SchedulingReasonCode'
          title: Reason Codes
          type: array
        task_id:
          title: Task Id
          type: string
        task_spec_id:
          description: 排期所依据的任务内容版本
          title: Task Spec Id
          type: string
      required:
      - task_id
      - task_spec_id
      - rank
      - allocated_minutes
      - reason_codes
      title: AgendaItemView
      type: object
    AgendaResponse:
      description: '某日的当前安排（05-module-contracts read_today）。


        读取不直接创建作业：尚无排期结果时 current 为 null，前端据此调用 generation 端点。'
      properties:
        current:
          anyOf:
          - $ref: '#/components/schemas/AgendaRevisionView'
          - type: 'null'
          description: 当前生效的排期结果；尚无时为 null
        local_date:
          format: date
          title: Local Date
          type: string
        planning_revision:
          description: 当前排期协调入口版本
          minimum: 0.0
          title: Planning Revision
          type: integer
      required:
      - local_date
      - planning_revision
      - current
      title: AgendaResponse
      type: object
    AgendaRevisionStatus:
      description: 单次排期结果状态（03 第 4 节 agenda_revisions.status）。
      enum:
      - ready
      - conflicted
      title: AgendaRevisionStatus
      type: string
    AgendaRevisionView:
      description: 一次排期计算的完整结果（13 号第 1 节 SchedulingResult 的持久化形状）。
      properties:
        capacity:
          $ref: '#/components/schemas/CapacitySummaryView'
        change_proposals:
          items:
            $ref: '#/components/schemas/ChangeProposalView'
          title: Change Proposals
          type: array
        conflicts:
          items:
            $ref: '#/components/schemas/ConflictView'
          title: Conflicts
          type: array
        created_at:
          format: date-time
          title: Created At
          type: string
        deferred:
          items:
            $ref: '#/components/schemas/DeferredTaskView'
          title: Deferred
          type: array
        id:
          title: Id
          type: string
        input_planning_revision:
          description: 计算基于的 planning revision
          minimum: 0.0
          title: Input Planning Revision
          type: integer
        items:
          items:
            $ref: '#/components/schemas/AgendaItemView'
          title: Items
          type: array
        scheduling_policy_version:
          description: 当时按哪版排期策略判定（Q08 可解释）
          title: Scheduling Policy Version
          type: string
        status:
          $ref: '#/components/schemas/AgendaRevisionStatus'
        version_no:
          minimum: 1.0
          title: Version No
          type: integer
      required:
      - id
      - version_no
      - status
      - input_planning_revision
      - scheduling_policy_version
      - capacity
      - items
      - deferred
      - conflicts
      - change_proposals
      - created_at
      title: AgendaRevisionView
      type: object
    AuthSessionResponse:
      description: 当前用户与会话元数据。不包含会话令牌。
      properties:
        session:
          $ref: '#/components/schemas/SessionInfo'
        user:
          $ref: '#/components/schemas/AccountUser'
      required:
      - user
      - session
      title: AuthSessionResponse
      type: object
    AvailabilityVersionResponse:
      description: 周额度版本（03 第 4 节 availability_versions）。
      properties:
        coordination_required:
          description: 已有安排需要协调时为 true（05-module-contracts update_availability）
          title: Coordination Required
          type: boolean
        created_at:
          format: date-time
          title: Created At
          type: string
        effective_from:
          description: 生效起始日期；按日期选择使用的版本
          format: date
          title: Effective From
          type: string
        id:
          title: Id
          type: string
        revision:
          description: 服务端当前版本号
          minimum: 0.0
          title: Revision
          type: integer
        version_no:
          minimum: 1.0
          title: Version No
          type: integer
        weekly_minutes:
          additionalProperties:
            type: integer
          description: 周一至周日七个额度（分钟），键为 monday…sunday
          title: Weekly Minutes
          type: object
      required:
      - revision
      - id
      - effective_from
      - weekly_minutes
      - version_no
      - created_at
      - coordination_required
      title: AvailabilityVersionResponse
      type: object
    CancelJobRequest:
      properties:
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
      required:
      - expected_revision
      title: CancelJobRequest
      type: object
    CapacityBasis:
      description: '当日容量的额度口径（13 号第 1 节 capacity_summary 的"额度来源"，取值为 T05 决策 A9）。


        total 按"全天额度 − 已投入"计剩余；remaining 从用户声明时点起扣除，

        不重复扣减已投入时间（03 第 4 节）。'
      enum:
      - total
      - remaining
      title: CapacityBasis
      type: string
    CapacitySummaryView:
      description: 当日额度汇总（13 号第 1 节 capacity_summary：额度来源、已投入、已保留和剩余分钟）。
      properties:
        basis:
          $ref: '#/components/schemas/CapacityBasis'
          description: 额度口径；total 按全天扣已投入，remaining 从声明时点起扣
        quota_minutes:
          description: 当日有效额度（分钟）
          minimum: 0.0
          title: Quota Minutes
          type: integer
        remaining_minutes:
          description: 当前剩余容量（分钟）
          minimum: 0.0
          title: Remaining Minutes
          type: integer
        reserved_minutes:
          description: 已保留（分钟）
          minimum: 0.0
          title: Reserved Minutes
          type: integer
        spent_minutes:
          description: 今日已投入（分钟）
          minimum: 0.0
          title: Spent Minutes
          type: integer
      required:
      - basis
      - quota_minutes
      - spent_minutes
      - reserved_minutes
      - remaining_minutes
      title: CapacitySummaryView
      type: object
    ChangeClass:
      description: '变更提案的判级（03 第 3 节 change_class，取值出处 18 号第 3 节、D04）。


        本期只含目标关联解除所需的两级；record_only / auto_schedule / auto_plan_local

        归 T12，届时随其契约 PR 扩展 CHECK（T06 决策 A5）。'
      enum:
      - confirmation_required
      - profile_revision_required
      title: ChangeClass
      type: string
    ChangePasswordRequest:
      properties:
        current_password:
          format: password
          maxLength: 1024
          title: Current Password
          type: string
          writeOnly: true
        new_password:
          description: 12–128 个字符，不得与账号标识相同
          format: password
          maxLength: 1024
          title: New Password
          type: string
          writeOnly: true
      required:
      - current_password
      - new_password
      title: ChangePasswordRequest
      type: object
    ChangeProposalActionRequest:
      description: 提案终态动作（接受 / 拒绝）。接受和应用在同一事务完成（03 第 3 节）。
      properties: {}
      title: ChangeProposalActionRequest
      type: object
    ChangeProposalResponse:
      description: 变更提案。解除关联时 change_class=confirmation_required（改变成功标准时升级，18 号第 3 节）。
      properties:
        accepted_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Accepted At
        applied_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Applied At
        change_class:
          $ref: '#/components/schemas/ChangeClass'
        created_at:
          format: date-time
          title: Created At
          type: string
        goal_id:
          title: Goal Id
          type: string
        id:
          title: Id
          type: string
        impact:
          $ref: '#/components/schemas/UnlinkImpact'
        input_revision:
          description: 提案生成时的 planning revision；落后于当前值即为 stale（T06 决策 A6）
          title: Input Revision
          type: integer
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        status:
          $ref: '#/components/schemas/ChangeProposalStatus'
          description: 提案基础版本已变时为 stale，不沿用旧确认
      required:
      - id
      - goal_id
      - change_class
      - status
      - input_revision
      - impact
      - reason
      - created_at
      - accepted_at
      - applied_at
      title: ChangeProposalResponse
      type: object
    ChangeProposalStatus:
      description: '变更提案状态（03 第 3 节 change_proposals.status）。


        接受和应用在同一事务完成；提案基础版本已变时置 stale。'
      enum:
      - pending
      - applied
      - rejected
      - stale
      title: ChangeProposalStatus
      type: string
    ChangeProposalView:
      description: '需要用户确认的变更建议（13 号第 6 节 pending change proposal）。


        里程碑延期、增加总投入、降低某目标投入、移动用户锁定/进行中任务或影响

        关联目标时不自动执行，生成待确认建议（D06）。'
      properties:
        description:
          description: 建议内容与理由
          title: Description
          type: string
        proposal_type:
          description: 建议类型：deadline_extension / increase_investment / reduce_investment / move_locked_task
            / cross_goal_impact（取值随业务实现固定）
          title: Proposal Type
          type: string
        requires_confirmation:
          default: true
          description: 首版建议一律待确认（D06）
          title: Requires Confirmation
          type: boolean
        task_ids:
          description: 涉及的任务
          items:
            type: string
          title: Task Ids
          type: array
      required:
      - proposal_type
      - description
      title: ChangeProposalView
      type: object
    CloseGoalRequest:
      properties:
        closure_kind:
          $ref: '#/components/schemas/ClosureKind'
        criteria_confirmations:
          description: 成功标准逐条确认；随结束操作写入快照，撤销后可还原（17 号第 4 节）
          items:
            $ref: '#/components/schemas/CriterionConfirmation'
          title: Criteria Confirmations
          type: array
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
        note:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Note
      required:
      - expected_revision
      - closure_kind
      - criteria_confirmations
      title: CloseGoalRequest
      type: object
    ClosureKind:
      description: 结束方式。completed 仅对 kind=achievement 开放（17 号第 2 节）。
      enum:
      - completed
      - stopped
      title: ClosureKind
      type: string
    ConfirmGoalLinkRequest:
      description: 确认建立关联。确认时在同一事务内校验同用户、不自关联、目标对不重复与全图无环（18 号第 2 节）。
      properties: {}
      title: ConfirmGoalLinkRequest
      type: object
    ConfirmProfileRequest:
      properties:
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
      required:
      - expected_revision
      title: ConfirmProfileRequest
      type: object
    ConflictView:
      description: 无法同时满足的硬约束或分钟缺口（13 号第 1、6 节）。
      properties:
        code:
          $ref: '#/components/schemas/SchedulingReasonCode'
        message:
          description: 面向用户的问题说明（Q04）
          title: Message
          type: string
        minutes_gap:
          anyOf:
          - type: integer
          - type: 'null'
          description: 缺口分钟数；不适用时为空
          title: Minutes Gap
        task_ids:
          description: 涉及的任务；必须项冲突时保留全部冲突项供用户选择
          items:
            type: string
          title: Task Ids
          type: array
      required:
      - code
      - task_ids
      - message
      title: ConflictView
      type: object
    ConstrainTaskRequest:
      description: '设置或清除单日任务约束（05-module-contracts constrain_today_task）。


        constraint_kind 为空表示清除该日该任务的既有约束。'
      properties:
        constraint_kind:
          anyOf:
          - $ref: '#/components/schemas/TaskDayConstraintKind'
          - type: 'null'
          description: must_do_today / locked；空值表示清除
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
      required:
      - expected_revision
      title: ConstrainTaskRequest
      type: object
    CreateGoalRequest:
      properties:
        initial_description:
          anyOf:
          - maxLength: 8000
            type: string
          - type: 'null'
          description: 自然语言目标描述，作为澄清对话的起点（R02）
          title: Initial Description
        title:
          maxLength: 200
          minLength: 1
          title: Title
          type: string
      required:
      - title
      title: CreateGoalRequest
      type: object
    CriterionConfirmation:
      description: 结束目标时对单条成功标准的确认。快照整体写入 goals.closure_criteria_snapshot_json（T04 决策 A8）。
      properties:
        criterion_key:
          description: 成功标准的标识，来自已确认档案的 success_criteria
          title: Criterion Key
          type: string
        met:
          description: 该标准是否已达成；允许部分达成时标记完成并记录未达成项（D12 第 3 节）
          title: Met
          type: boolean
        note:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          description: 对未达成项的记录说明
          title: Note
      required:
      - criterion_key
      - met
      title: CriterionConfirmation
      type: object
    DailyOverrideKind:
      description: '当天额度口径（03 第 4 节 daily_overrides.override_kind）。


        total 是"今天共有多少时间"，remaining 是"从声明时点起还剩多少时间"；

        两种口径不可混用，剩余容量计算方式不同（03 第 4 节）。'
      enum:
      - total
      - remaining
      title: DailyOverrideKind
      type: string
    DailyOverrideResponse:
      description: 单日额度声明（03 第 4 节 daily_overrides）。
      properties:
        coordination_required:
          description: 已有安排需要协调时为 true
          title: Coordination Required
          type: boolean
        local_date:
          format: date
          title: Local Date
          type: string
        measured_at:
          description: 声明时间；remaining 口径从此刻起扣减
          format: date-time
          title: Measured At
          type: string
        minutes:
          minimum: 0.0
          title: Minutes
          type: integer
        override_kind:
          $ref: '#/components/schemas/DailyOverrideKind'
          description: total 与 remaining 是两种口径，不可混用
        revision:
          description: 服务端当前版本号
          minimum: 0.0
          title: Revision
          type: integer
      required:
      - revision
      - local_date
      - override_kind
      - minutes
      - measured_at
      - coordination_required
      title: DailyOverrideResponse
      type: object
    DeferredTaskView:
      description: 未进入当天的任务及原因（13 号第 1 节 deferred_tasks）。
      properties:
        detail:
          anyOf:
          - type: string
          - type: 'null'
          description: 面向用户的补充说明
          title: Detail
        reason_code:
          $ref: '#/components/schemas/SchedulingReasonCode'
        task_id:
          title: Task Id
          type: string
      required:
      - task_id
      - reason_code
      title: DeferredTaskView
      type: object
    DependencyCheckStatus:
      description: '暂停响应中跨目标依赖影响的检查标记（T04 决策 A12）。


        not_wired 表示依赖校验尚未接入（T06 建 task_dependencies 前），此时影响列表为空

        仅因"未检查"，不代表"无影响"。'
      enum:
      - wired
      - not_wired
      title: DependencyCheckStatus
      type: string
    DependencyOutcome:
      description: '任务依赖的满足条件（03 第 3 节 required_outcome；产品 13 号第 3 节）。


        区分"执行完成"与"验证通过"；健身领域不允许 verification_passed 是应用层

        策略谓词 fitness_dependency_outcome（16 号第 2 节），不在 DB CHECK 里。'
      enum:
      - execution_completed
      - verification_passed
      title: DependencyOutcome
      type: string
    DeriveGoalRequest:
      properties:
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
      required:
      - expected_revision
      title: DeriveGoalRequest
      type: object
    DerivedMetric:
      description: 服务端计算的路线派生指标，模型不能覆盖（11 号第 4 节）。
      properties:
        available_weekly_minutes:
          default: 0
          title: Available Weekly Minutes
          type: integer
        budget_gap_minutes:
          default: 0
          title: Budget Gap Minutes
          type: integer
        conflicts:
          description: 预算、期限或与其他目标的冲突
          items:
            additionalProperties: true
            type: object
          title: Conflicts
          type: array
        peak_weekly_minutes:
          default: 0
          title: Peak Weekly Minutes
          type: integer
        recommendation_eligible:
          default: false
          title: Recommendation Eligible
          type: boolean
        total_estimated_minutes:
          default: 0
          title: Total Estimated Minutes
          type: integer
      title: DerivedMetric
      type: object
    DraftTaskResponse:
      description: 计划草稿中的任务。draft 计划的任务为 proposed，不出现在正式待办（R05）。
      properties:
        batch_window:
          additionalProperties: true
          description: 所属批次的 window_start / window_end
          title: Batch Window
          type: object
        can_split:
          title: Can Split
          type: boolean
        earliest_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Earliest Date
        execution_status:
          $ref: '#/components/schemas/TaskExecutionStatus'
        executor:
          $ref: '#/components/schemas/TaskExecutor'
        expected_minutes:
          minimum: 0.0
          title: Expected Minutes
          type: integer
        latest_date:
          description: 非空；由计划生成时推导（05-module-contracts 默认值表）
          format: date
          title: Latest Date
          type: string
        maximum_minutes:
          minimum: 0.0
          title: Maximum Minutes
          type: integer
        milestone_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Milestone Id
        minimum_minutes:
          minimum: 0.0
          title: Minimum Minutes
          type: integer
        minimum_session_minutes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Minimum Session Minutes
        phase_id:
          title: Phase Id
          type: string
        revision:
          description: 服务端当前版本号
          minimum: 0.0
          title: Revision
          type: integer
        spec_no:
          description: 内容版本号；草稿编辑产生新 spec，原 spec 保留
          minimum: 1.0
          title: Spec No
          type: integer
        task_id:
          title: Task Id
          type: string
        title:
          title: Title
          type: string
