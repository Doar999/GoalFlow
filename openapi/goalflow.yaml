components:
  schemas:
    ErrorCode:
      description: 对外错误码。
      enum:
      - VALIDATION_FAILED
      - UNAUTHENTICATED
      - FORBIDDEN
      - NOT_FOUND
      - INTERNAL_ERROR
      - IDEMPOTENCY_KEY_CONFLICT
      - REVISION_CONFLICT
      - BUDGET_CONFLICT
      - DEPENDENCY_CYCLE
      - CONFIRMATION_REQUIRED
      - INPUT_STALE
      - MODEL_UNAVAILABLE
      title: ErrorCode
      type: string
    ErrorResponse:
      description: 所有 API 错误的唯一响应体。各模块不得自定义错误体。
      example:
        code: REVISION_CONFLICT
        details: {}
        message: 计划版本已过期，请刷新后重试
        request_id: req_0000000000
        retryable: false
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: 错误码，取自 contracts.errors.ErrorCode 单点定义
        details:
          additionalProperties: true
          description: 补充信息。不含其他用户的数据，也不含模型凭证或其片段。
          title: Details
          type: object
        message:
          description: 面向用户的可读说明
          title: Message
          type: string
        request_id:
          description: 本次请求标识，与响应头 X-Request-Id 一致
          title: Request Id
          type: string
        retryable:
          description: 原样重试是否有意义
          title: Retryable
          type: boolean
      required:
      - code
      - message
      - request_id
      - retryable
      title: ErrorResponse
      type: object
    HealthResponse:
      properties:
        status:
          const: ok
          description: 进程可响应请求时固定为 ok
          title: Status
          type: string
      required:
      - status
      title: HealthResponse
      type: object
info:
  description: GoalFlow 的 HTTP 契约事实源。本文档由 scripts/api-generate.sh 导出，禁止手工编辑。
  title: GoalFlow API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/health:
    get:
      description: 不校验会话，不访问数据库。只表示进程能响应请求。
      operationId: read_health_api_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Successful Response
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 服务内部错误
      summary: 存活检查
      tags:
      - meta
