components:
  schemas:
    AccountUser:
      properties:
        account_identifier:
          description: 规范化后的账号标识
          title: Account Identifier
          type: string
        id:
          title: Id
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        timezone:
          description: IANA 时区名
          title: Timezone
          type: string
      required:
      - id
      - account_identifier
      - role
      - timezone
      title: AccountUser
      type: object
    AuthSessionResponse:
      description: 当前用户与会话元数据。不包含会话令牌。
      properties:
        session:
          $ref: '#/components/schemas/SessionInfo'
        user:
          $ref: '#/components/schemas/AccountUser'
      required:
      - user
      - session
      title: AuthSessionResponse
      type: object
    CancelJobRequest:
      properties:
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
      required:
      - expected_revision
      title: CancelJobRequest
      type: object
    ChangePasswordRequest:
      properties:
        current_password:
          format: password
          maxLength: 1024
          title: Current Password
          type: string
          writeOnly: true
        new_password:
          description: 12–128 个字符，不得与账号标识相同
          format: password
          maxLength: 1024
          title: New Password
          type: string
          writeOnly: true
      required:
      - current_password
      - new_password
      title: ChangePasswordRequest
      type: object
    ErrorCode:
      description: 对外错误码。
      enum:
      - VALIDATION_FAILED
      - UNAUTHENTICATED
      - FORBIDDEN
      - NOT_FOUND
      - INTERNAL_ERROR
      - RATE_LIMITED
      - INVALID_CREDENTIALS
      - ACCOUNT_IDENTIFIER_UNAVAILABLE
      - REGISTRATION_CLOSED
      - IDEMPOTENCY_KEY_CONFLICT
      - REVISION_CONFLICT
      - BUDGET_CONFLICT
      - DEPENDENCY_CYCLE
      - CONFIRMATION_REQUIRED
      - INPUT_STALE
      - MODEL_UNAVAILABLE
      title: ErrorCode
      type: string
    ErrorResponse:
      description: 所有 API 错误的唯一响应体。各模块不得自定义错误体。
      example:
        code: REVISION_CONFLICT
        details: {}
        message: 计划版本已过期，请刷新后重试
        request_id: req_0000000000
        retryable: false
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: 错误码，取自 contracts.errors.ErrorCode 单点定义
        details:
          additionalProperties: true
          description: 补充信息。不含其他用户的数据，也不含模型凭证或其片段。
          title: Details
          type: object
        message:
          description: 面向用户的可读说明
          title: Message
          type: string
        request_id:
          description: 本次请求标识，与响应头 X-Request-Id 一致
          title: Request Id
          type: string
        retryable:
          description: 原样重试是否有意义
          title: Retryable
          type: boolean
      required:
      - code
      - message
      - request_id
      - retryable
      title: ErrorResponse
      type: object
    HealthResponse:
      properties:
        status:
          const: ok
          description: 进程可响应请求时固定为 ok
          title: Status
          type: string
      required:
      - status
      title: HealthResponse
      type: object
    JobEventMessage:
      description: 事件流里每条消息的 data 字段（JSON）。SSE 的 id 为 sequence，event 为 type。
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        payload:
          additionalProperties: true
          description: 随事件类型而定，例如 stage_completed 带 stage 名
          title: Payload
          type: object
        sequence:
          description: 单个作业内从 1 起连续递增；断线重连时作为 Last-Event-ID 发回
          minimum: 1.0
          title: Sequence
          type: integer
        type:
          $ref: '#/components/schemas/JobEventType'
          description: completed、failed、cancelled、stale 是终态事件，收到后流随即结束
      required:
      - sequence
      - type
      - payload
      - created_at
      title: JobEventMessage
      type: object
    JobEventType:
      description: '作业持久化事件（T07 决策 E19），SSE 按 sequence 补读。


        completed、failed、cancelled、stale 是终态事件，订阅方收到后即可关闭连接。'
      enum:
      - queued
      - started
      - stage_completed
      - awaiting_confirmation
      - retrying
      - completed
      - failed
      - cancelled
      - stale
      title: JobEventType
      type: string
    JobResponse:
      description: 作业的当前状态。只含展示与恢复所需的字段，不含输入快照。
      properties:
        attempts:
          description: 已经开始过的尝试次数，最多 3 次
          minimum: 0.0
          title: Attempts
          type: integer
        cancel_requested:
          description: 已请求取消但作业仍在运行，等待 Worker 在下一个检查点停下
          title: Cancel Requested
          type: boolean
        created_at:
          format: date-time
          title: Created At
          type: string
        error_code:
          anyOf:
          - $ref: '#/components/schemas/ErrorCode'
          - type: 'null'
          description: 失败、重试等待或过期时的错误码
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          description: 面向用户的错误说明
          title: Error Message
        finished_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Finished At
        id:
          title: Id
          type: string
        kind:
          description: 作业种类，由提交它的业务模块定义
          title: Kind
          type: string
        result_refs:
          description: 成功后产出的资源引用；未成功时为空
          items:
            $ref: '#/components/schemas/JobResultRef'
          title: Result Refs
          type: array
        revision:
          description: 服务端当前版本号
          minimum: 0.0
          title: Revision
          type: integer
        status:
          $ref: '#/components/schemas/JobStatus'
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - revision
      - id
      - kind
      - status
      - attempts
      - result_refs
      - error_code
      - error_message
      - cancel_requested
      - created_at
      - updated_at
      - finished_at
      title: JobResponse
      type: object
    JobResultRef:
      properties:
        id:
          title: Id
          type: string
        type:
          description: 结果资源的类型，例如 route_set
          title: Type
          type: string
      required:
      - type
      - id
      title: JobResultRef
      type: object
    JobStatus:
      description: '后台作业状态（T07 决策 E9）。


        queued → running → succeeded / failed / cancelled / stale；可重试错误经 retry_wait 回到 queued。

        后四个是终态，进入后不再变化。等待用户确认属于业务会话状态，不是作业状态。'
      enum:
      - queued
      - running
      - retry_wait
      - succeeded
      - failed
      - cancelled
      - stale
      title: JobStatus
      type: string
    LoginRequest:
      properties:
        account_identifier:
          maxLength: 1024
          title: Account Identifier
          type: string
        password:
          format: password
          maxLength: 1024
          title: Password
          type: string
          writeOnly: true
      required:
      - account_identifier
      - password
      title: LoginRequest
      type: object
    RegisterRequest:
      properties:
        account_identifier:
          description: 账号标识，可以是用户名或邮箱格式（首版不验证邮箱）。规范化后需为 3–254 个字符，不含空白
          maxLength: 1024
          title: Account Identifier
          type: string
        password:
          description: 12–128 个字符，不得与账号标识相同
          format: password
          maxLength: 1024
          title: Password
          type: string
          writeOnly: true
        timezone:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          description: IANA 时区名，例如 Asia/Shanghai。省略时为 UTC
          title: Timezone
      required:
      - account_identifier
      - password
      title: RegisterRequest
      type: object
    RegistrationStatusResponse:
      properties:
        registration_open:
          description: 本实例是否接受新用户注册。关闭后已有用户仍可登录
          title: Registration Open
          type: boolean
      required:
      - registration_open
      title: RegistrationStatusResponse
      type: object
    ResetPasswordRequest:
      properties:
        new_password:
          description: 12–128 个字符，不得与账号标识相同
          format: password
          maxLength: 1024
          title: New Password
          type: string
          writeOnly: true
        token:
          description: 部署者用本地命令签发的一次性重置令牌
          format: password
          maxLength: 1024
          title: Token
          type: string
          writeOnly: true
      required:
      - token
      - new_password
      title: ResetPasswordRequest
      type: object
    SessionInfo:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        expires_at:
          description: 绝对过期时间。7 天无活动会更早失效
          format: date-time
          title: Expires At
          type: string
      required:
      - created_at
      - expires_at
      title: SessionInfo
      type: object
    UserRole:
      description: 账号角色。首位注册者不自动成为管理员，只能由部署者本地命令授予。
      enum:
      - user
      - admin
      title: UserRole
      type: string
info:
  description: GoalFlow 的 HTTP 契约事实源。本文档由 scripts/api-generate.sh 导出，禁止手工编辑。
  title: GoalFlow API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/auth/login:
    post:
      description: 账号不存在、密码错误、账号已禁用统一返回 INVALID_CREDENTIALS。已登录时再次登录会撤销旧会话。
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录、会话失效或凭证错误
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求来源不受信任，或本实例已关闭注册
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求参数校验未通过
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 尝试次数过多，响应头 Retry-After 给出需等待的秒数
      summary: 登录
      tags:
      - auth
  /api/auth/logout:
    post:
      description: 未登录或会话已失效时同样返回 204。
      operationId: logout_api_auth_logout_post
      responses:
        '204':
          description: Successful Response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求来源不受信任，或本实例已关闭注册
      summary: 退出当前会话
      tags:
      - auth
  /api/auth/logout-all:
    post:
      description: 撤销该用户的全部会话，包括当前会话。
      operationId: logout_all_api_auth_logout_all_post
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录、会话失效或凭证错误
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求来源不受信任，或本实例已关闭注册
      summary: 退出全部设备
      tags:
      - auth
  /api/auth/password/change:
    post:
      description: 成功后撤销该用户的全部旧会话，并为当前设备换发新会话 Cookie。
      operationId: change_password_api_auth_password_change_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录、会话失效或凭证错误
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求来源不受信任，或本实例已关闭注册
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求参数校验未通过
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 尝试次数过多，响应头 Retry-After 给出需等待的秒数
      summary: 修改密码
      tags:
      - auth
  /api/auth/password/reset-with-token:
    post:
      description: 令牌一次性、30 分钟内有效。成功后该用户全部会话失效，需重新登录。
      operationId: reset_password_with_token_api_auth_password_reset_with_token_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录、会话失效或凭证错误
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求来源不受信任，或本实例已关闭注册
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求参数校验未通过
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 尝试次数过多，响应头 Retry-After 给出需等待的秒数
      summary: 凭重置令牌设置新密码
      tags:
      - auth
  /api/auth/register:
    post:
      description: 创建账号并建立会话，会话令牌通过 Cookie 下发。首位注册者不会自动成为管理员。
      operationId: register_api_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
          description: Successful Response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求来源不受信任，或本实例已关闭注册
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 账号标识不可用
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求参数校验未通过
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 尝试次数过多，响应头 Retry-After 给出需等待的秒数
      summary: 注册并登录
      tags:
      - auth
  /api/auth/registration:
    get:
      description: 登录与注册页据此决定是否展示注册入口，与注册接口的行为保持一致。
      operationId: read_registration_status_api_auth_registration_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationStatusResponse'
          description: Successful Response
      summary: 注册是否开放
      tags:
      - auth
  /api/auth/session:
    get:
      operationId: read_session_api_auth_session_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录、会话失效或凭证错误
      summary: 当前用户与会话
      tags:
      - auth
  /api/health:
    get:
      description: 不校验会话，不访问数据库。只表示进程能响应请求。
      operationId: read_health_api_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Successful Response
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 服务内部错误
      summary: 存活检查
      tags:
      - meta
  /api/jobs/{job_id}:
    get:
      description: 刷新页面、断线或事件流结束后，用它取得作业的最终状态与结果引用。
      operationId: inspect_job_api_jobs__job_id__get
      parameters:
      - description: 作业 ID
        in: path
        name: job_id
        required: true
        schema:
          description: 作业 ID
          maxLength: 36
          title: Job Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录或会话失效
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 作业不存在，或不属于当前用户
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求参数校验未通过
      summary: 查询作业
      tags:
      - jobs
  /api/jobs/{job_id}/cancellation:
    post:
      description: 排队或等待重试中的作业立即取消；运行中的作业记下取消请求，在下一个检查点停下。已结束的作业原样返回当前状态，已成功发布的结果不会被撤销。
      operationId: request_job_cancellation_api_jobs__job_id__cancellation_post
      parameters:
      - description: 作业 ID
        in: path
        name: job_id
        required: true
        schema:
          description: 作业 ID
          maxLength: 36
          title: Job Id
          type: string
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelJobRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录或会话失效
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求来源不受信任
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 作业不存在，或不属于当前用户
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 作业版本已更新（REVISION_CONFLICT），或 Idempotency-Key 已用于另一项请求（IDEMPOTENCY_KEY_CONFLICT）
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求参数校验未通过
      summary: 取消作业
      tags:
      - jobs
  /api/jobs/{job_id}/events:
    get:
      description: text/event-stream。每条消息的 id 为 sequence、event 为事件类型、data 为 JobEventMessage 的 JSON。先补发
        Last-Event-ID 之后的全部持久化事件，再持续推送新事件；收到终态事件后服务端关闭连接。无新事件时每 15 秒发一行注释作为心跳；单条连接最长 5 分钟，之后由客户端重连。断开连接不会取消作业。
      operationId: watch_job_api_jobs__job_id__events_get
      parameters:
      - description: 作业 ID
        in: path
        name: job_id
        required: true
        schema:
          description: 作业 ID
          maxLength: 36
          title: Job Id
          type: string
      - description: 已收到的最后一个 sequence；浏览器重连时自动携带
        in: header
        name: Last-Event-ID
        required: false
        schema:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          description: 已收到的最后一个 sequence；浏览器重连时自动携带
          title: Last-Event-Id
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/JobEventMessage'
                type: string
          description: 事件流；schema 描述的是每条消息的 data
        '401':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录或会话失效
        '404':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 作业不存在，或不属于当前用户
        '422':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求参数校验未通过
      summary: 订阅作业事件（SSE）
      tags:
      - jobs
