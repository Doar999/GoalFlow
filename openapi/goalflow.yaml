components:
  schemas:
    AccountUser:
      properties:
        account_identifier:
          description: 规范化后的账号标识
          title: Account Identifier
          type: string
        id:
          title: Id
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        timezone:
          description: IANA 时区名
          title: Timezone
          type: string
      required:
      - id
      - account_identifier
      - role
      - timezone
      title: AccountUser
      type: object
    AuthSessionResponse:
      description: 当前用户与会话元数据。不包含会话令牌。
      properties:
        session:
          $ref: '#/components/schemas/SessionInfo'
        user:
          $ref: '#/components/schemas/AccountUser'
      required:
      - user
      - session
      title: AuthSessionResponse
      type: object
    ChangePasswordRequest:
      properties:
        current_password:
          format: password
          maxLength: 1024
          title: Current Password
          type: string
          writeOnly: true
        new_password:
          description: 12–128 个字符，不得与账号标识相同
          format: password
          maxLength: 1024
          title: New Password
          type: string
          writeOnly: true
      required:
      - current_password
      - new_password
      title: ChangePasswordRequest
      type: object
    ErrorCode:
      description: 对外错误码。
      enum:
      - VALIDATION_FAILED
      - UNAUTHENTICATED
      - FORBIDDEN
      - NOT_FOUND
      - INTERNAL_ERROR
      - RATE_LIMITED
      - INVALID_CREDENTIALS
      - ACCOUNT_IDENTIFIER_UNAVAILABLE
      - REGISTRATION_CLOSED
      - IDEMPOTENCY_KEY_CONFLICT
      - REVISION_CONFLICT
      - BUDGET_CONFLICT
      - DEPENDENCY_CYCLE
      - CONFIRMATION_REQUIRED
      - INPUT_STALE
      - MODEL_UNAVAILABLE
      title: ErrorCode
      type: string
    ErrorResponse:
      description: 所有 API 错误的唯一响应体。各模块不得自定义错误体。
      example:
        code: REVISION_CONFLICT
        details: {}
        message: 计划版本已过期，请刷新后重试
        request_id: req_0000000000
        retryable: false
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: 错误码，取自 contracts.errors.ErrorCode 单点定义
        details:
          additionalProperties: true
          description: 补充信息。不含其他用户的数据，也不含模型凭证或其片段。
          title: Details
          type: object
        message:
          description: 面向用户的可读说明
          title: Message
          type: string
        request_id:
          description: 本次请求标识，与响应头 X-Request-Id 一致
          title: Request Id
          type: string
        retryable:
          description: 原样重试是否有意义
          title: Retryable
          type: boolean
      required:
      - code
      - message
      - request_id
      - retryable
      title: ErrorResponse
      type: object
    HealthResponse:
      properties:
        status:
          const: ok
          description: 进程可响应请求时固定为 ok
          title: Status
          type: string
      required:
      - status
      title: HealthResponse
      type: object
    LoginRequest:
      properties:
        account_identifier:
          maxLength: 1024
          title: Account Identifier
          type: string
        password:
          format: password
          maxLength: 1024
          title: Password
          type: string
          writeOnly: true
      required:
      - account_identifier
      - password
      title: LoginRequest
      type: object
    RegisterRequest:
      properties:
        account_identifier:
          description: 账号标识，可以是用户名或邮箱格式（首版不验证邮箱）。规范化后需为 3–254 个字符，不含空白
          maxLength: 1024
          title: Account Identifier
          type: string
        password:
          description: 12–128 个字符，不得与账号标识相同
          format: password
          maxLength: 1024
          title: Password
          type: string
          writeOnly: true
        timezone:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          description: IANA 时区名，例如 Asia/Shanghai。省略时为 UTC
          title: Timezone
      required:
      - account_identifier
      - password
      title: RegisterRequest
      type: object
    RegistrationStatusResponse:
      properties:
        registration_open:
          description: 本实例是否接受新用户注册。关闭后已有用户仍可登录
          title: Registration Open
          type: boolean
      required:
      - registration_open
      title: RegistrationStatusResponse
      type: object
    ResetPasswordRequest:
      properties:
        new_password:
          description: 12–128 个字符，不得与账号标识相同
          format: password
          maxLength: 1024
          title: New Password
          type: string
          writeOnly: true
        token:
          description: 部署者用本地命令签发的一次性重置令牌
          format: password
          maxLength: 1024
          title: Token
          type: string
          writeOnly: true
      required:
      - token
      - new_password
      title: ResetPasswordRequest
      type: object
    SessionInfo:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        expires_at:
          description: 绝对过期时间。7 天无活动会更早失效
          format: date-time
          title: Expires At
          type: string
      required:
      - created_at
      - expires_at
      title: SessionInfo
      type: object
    UserRole:
      description: 账号角色。首位注册者不自动成为管理员，只能由部署者本地命令授予。
      enum:
      - user
      - admin
      title: UserRole
      type: string
info:
  description: GoalFlow 的 HTTP 契约事实源。本文档由 scripts/api-generate.sh 导出，禁止手工编辑。
  title: GoalFlow API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/auth/login:
    post:
      description: 账号不存在、密码错误、账号已禁用统一返回 INVALID_CREDENTIALS。已登录时再次登录会撤销旧会话。
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录、会话失效或凭证错误
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求来源不受信任，或本实例已关闭注册
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求参数校验未通过
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 尝试次数过多，响应头 Retry-After 给出需等待的秒数
      summary: 登录
      tags:
      - auth
  /api/auth/logout:
    post:
      description: 未登录或会话已失效时同样返回 204。
      operationId: logout_api_auth_logout_post
      responses:
        '204':
          description: Successful Response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求来源不受信任，或本实例已关闭注册
      summary: 退出当前会话
      tags:
      - auth
  /api/auth/logout-all:
    post:
      description: 撤销该用户的全部会话，包括当前会话。
      operationId: logout_all_api_auth_logout_all_post
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录、会话失效或凭证错误
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求来源不受信任，或本实例已关闭注册
      summary: 退出全部设备
      tags:
      - auth
  /api/auth/password/change:
    post:
      description: 成功后撤销该用户的全部旧会话，并为当前设备换发新会话 Cookie。
      operationId: change_password_api_auth_password_change_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录、会话失效或凭证错误
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求来源不受信任，或本实例已关闭注册
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求参数校验未通过
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 尝试次数过多，响应头 Retry-After 给出需等待的秒数
      summary: 修改密码
      tags:
      - auth
  /api/auth/password/reset-with-token:
    post:
      description: 令牌一次性、30 分钟内有效。成功后该用户全部会话失效，需重新登录。
      operationId: reset_password_with_token_api_auth_password_reset_with_token_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录、会话失效或凭证错误
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求来源不受信任，或本实例已关闭注册
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求参数校验未通过
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 尝试次数过多，响应头 Retry-After 给出需等待的秒数
      summary: 凭重置令牌设置新密码
      tags:
      - auth
  /api/auth/register:
    post:
      description: 创建账号并建立会话，会话令牌通过 Cookie 下发。首位注册者不会自动成为管理员。
      operationId: register_api_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
          description: Successful Response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求来源不受信任，或本实例已关闭注册
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 账号标识不可用
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求参数校验未通过
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 尝试次数过多，响应头 Retry-After 给出需等待的秒数
      summary: 注册并登录
      tags:
      - auth
  /api/auth/registration:
    get:
      description: 登录与注册页据此决定是否展示注册入口，与注册接口的行为保持一致。
      operationId: read_registration_status_api_auth_registration_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationStatusResponse'
          description: Successful Response
      summary: 注册是否开放
      tags:
      - auth
  /api/auth/session:
    get:
      operationId: read_session_api_auth_session_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录、会话失效或凭证错误
      summary: 当前用户与会话
      tags:
      - auth
  /api/health:
    get:
      description: 不校验会话，不访问数据库。只表示进程能响应请求。
      operationId: read_health_api_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Successful Response
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 服务内部错误
      summary: 存活检查
      tags:
      - meta
