name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一分支的新提交取消旧的运行，避免排队浪费。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 静态检查与契约漂移
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: bash scripts/install.sh

      - name: 检查
        run: bash scripts/check.sh

  test:
    name: 测试
    runs-on: ubuntu-latest
    # seekdb 服务尚未接入。T01 兼容性验证完成后，在这里补 services 或容器启动步骤，
    # 并让数据库相关测试跑在真实 seekdb 上——SQLite 通过不算通过。
    # 见 docs/engineering/03-code-and-test-standards.md。
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: bash scripts/install.sh

      - name: 运行测试
        run: bash scripts/test.sh

  pr-hygiene:
    name: PR 规范
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 契约变更不得与业务实现混在同一 PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
          echo "本次改动文件："
          echo "$CHANGED"

          contract=0
          impl=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              openapi/*|backend/migrations/*|backend/src/goalflow/contracts/*)
                contract=1 ;;
              frontend/src/shared/api/generated/*)
                # 生成物随契约一起变更，不算业务实现
                ;;
              backend/src/goalflow/*|frontend/src/*)
                impl=1 ;;
            esac
          done <<< "$CHANGED"

          if [ "$contract" -eq 1 ] && [ "$impl" -eq 1 ]; then
            echo "::error::公共契约变更（openapi / migrations / contracts）必须单独成 PR，不得夹带业务实现。见 docs/engineering/01-contracts-and-ownership.md 第 3 节。"
            exit 1
          fi
          echo "通过"

      - name: 已合并的迁移不得被修改
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          MODIFIED="$(git diff --name-only --diff-filter=MD "$BASE" "$HEAD" -- 'backend/migrations/versions/*' || true)"
          if [ -n "$MODIFIED" ]; then
            echo "::error::检测到对已存在迁移的修改或删除。修正请改为新增迁移，见 docs/engineering/01-contracts-and-ownership.md 第 6 节。"
            echo "$MODIFIED"
            exit 1
          fi
          echo "通过"
